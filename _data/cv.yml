    - title: Flatiron Research Fellow
      institution: Flatiron Institute, New York City, New York, US
      year: Jun 2022 - Apr 2025
      description:
        - Center of Computational Mathematics (CCM) and Structural Molecular Biophysics group (SMBp)
        - title: Ensemble Refinement & Software Development
          contents:
            - Led the development of Bayesian inference frameworks for extracting molecular structural information from highly noisy cryo-EM imaging data.
            - Optimized likelihood-based inference algorithms using PyTorch and GPU-accelerated computing, achieving more than 20x acceleration over CPU baselines, enabling new Bayesian applications in biomolecular structure determination.
            - Integrated the algorithms into end-to-end software pipelines for processing and analyzing hundreds of TBs of cryo-EM datasets across multiple GPUs on HPC.
            - Extended Bayesian inference approaches beyond cryo-EM to experimental chromatin datasets, developing methods to infer ensemble structural distributions from heterogeneous biological measurements.
            - Guided junior researchers on Bayesian modelling, scientific machine learning, molecular dynamics simulations, and high-performance computational workflows.

    - title: Ph.D. Researcher
      institution: Brown University, Providence, RI, USA
      year: Sept 2017 - May 2022
      description:
        - title: Biophysics & Computational Physics Research
          contents:
            - Developed computational methods combining molecular simulation, statistical inference, and machine learning to study complex biomolecular systems.
            - Performed large-scale molecular dynamics simulations (using GROMACS and OpenMM) to investigate molecular interactions, conformational landscapes, and phase behaviour of intrinsically disordered proteins.
            - Applied advanced enhanced sampling methods, including REMD (Replica Exchange Molecular Dynamics) and PT-WTE (Parallel Tempering Well-Tempered Ensemble), to characterize rare conformational states and molecular mechanisms.
            - Developed Gaussian process-based feature selection and topological data analysis approaches to extract meaningful structural representations from high-dimensional protein MD simulation datasets.
            - Applied machine learning methods to identify structural features distinguishing protein variants and predict mutational effects from limited simulation data.
            - Built scalable HPC workflows for molecular simulation, trajectory analysis, and large-scale scientific data processing.

